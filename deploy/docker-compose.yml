# 在仓库根目录执行：docker compose -f deploy/docker-compose.yml up -d --build
services:
  minimon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: minimon-server:latest
    container_name: minimon
    restart: unless-stopped
    ports:
      - "25780:25780"
    volumes:
      - minimon-data:/data
    stop_grace_period: 20s

volumes:
  minimon-data:
