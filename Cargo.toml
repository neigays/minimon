[workspace]
resolver = "3"
members = ["crates/common", "crates/agent", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
minimon-common = { path = "crates/common" }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
