[package]
name = "minimon-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tzdb-bundle-always"] }
minimon-common = { workspace = true }
rand = "0.10.4"
# rustls-no-provider：不带 aws-lc-rs，由 notify 模块显式安装 ring 作为加密后端
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusqlite_migration = "2.9.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
toml = "1.2.3"
tracing.workspace = true
tracing-subscriber = "0.3.23"

[dev-dependencies]
minimon-agent = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
